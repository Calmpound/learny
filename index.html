<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Learny">
<meta name="application-name" content="Learny">
<meta name="theme-color" content="#000000">
<meta name="description" content="A Pokémon-style learning adventure for any topic.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#000}
html,body{overscroll-behavior:none}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
button,canvas{-webkit-touch-callout:none}
</style>
</head>
<body>

<title>Learny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one handheld column — status strip, 3:2 pixel screen, control deck pinned to the bottom (D-pad bottom-left, A/B bottom-right). Single committed handheld look: indigo shell, white message boxes with blue-grey frames. */
:root{
  --bg:#000000; --shell:#000000; --shell-hi:#3fbf60; --well:#2c8f45; --btn-green:#2fa84f; --btn-green-d:#1f7a38;
  --ink:#383848; --ink-2:#5e6676; --paper:#f8f8f8; --paper-2:#dfe9f0; --rule:#c6d2da; --muted:#a3abd6;
  --frame:#485868; --frame-in:#a8c8e0; --gba-out:#304048;
  --accent:#e8a33d; --on-accent:#18212b; --good:#2e8a55; --good-bg:#e1f1e6; --bad:#b9443a; --bad-bg:#f6e0da; --skip-bg:#ebe7dc;
  --hp:#45b46a; --hp-mid:#e0ad35; --hp-low:#d4553f; --xp:#4d8bd4;
  --ground:#78c850; --ground-2:#5ea040; --ground-3:#3c7028; --sky:#f0f4d8;
  --f-pixel:"Pixelify Sans","Courier New",monospace; --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--paper);font:15px/1.5 var(--f-body);padding-inline:16px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
.sheet,.terms,#dlg .txt{-webkit-user-select:text;user-select:text}
.sheet button,.btn{-webkit-user-select:none;user-select:none}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{position:relative;max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:10px 16px}

/* status strip */
#hud{display:flex;align-items:center;gap:10px;font-family:var(--f-pixel);font-size:13px;color:var(--paper-2);min-height:26px}
#hud .place{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:600;color:var(--paper)}
#hud .stat{display:flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.meter{width:56px;height:7px;border-radius:4px;background:var(--well);overflow:hidden;border:1px solid #000}
.meter>i{display:block;height:100%;width:100%;background:var(--hp);transition:width .45s ease,background-color .3s}
.badgerow{display:flex;gap:3px}
.badgerow b{width:7px;height:7px;transform:rotate(45deg);background:#34485b;display:block}
.badgerow b.on{background:var(--accent)}
#savedot{width:8px;height:8px;border-radius:50%;background:#34485b;flex:none}
#savedot.ok{background:var(--good)}#savedot.busy{background:var(--hp-mid)}#savedot.err{background:var(--bad)}
@media (max-width:400px){#coins{font-size:12px}#hud{gap:7px}}

/* screen */
#screen{position:relative;overflow:hidden;background:#000;width:100%;margin-inline:auto}
@media (max-width:600px){#screen{width:auto;min-width:0;margin-inline:-16px}}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .2s}
#fade.on{opacity:1}
#banner{position:absolute;left:8px;top:8px;background:var(--paper);color:var(--ink);font-family:var(--f-pixel);font-weight:600;font-size:14px;padding:4px 10px;border:2px solid var(--ink);border-radius:6px;transition:opacity .5s,transform .5s;pointer-events:none}
#banner.off{opacity:0;transform:translateY(-6px)}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:var(--f-pixel);font-size:13px;padding:5px 12px;border-radius:20px;white-space:nowrap;pointer-events:none}

/* control deck */
#deck{position:relative;margin-top:auto;background:var(--shell);border-radius:14px 14px 34px 34px;padding:12px 14px 18px;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:'dpad menu ab';align-items:end;gap:8px;min-height:190px;}
.dpad{grid-area:dpad;justify-self:start;align-self:end;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
.dpad button{background:var(--well);border:0;color:#eafbe9;font-size:15px;touch-action:none}
.dpad button.held{background:var(--shell-hi);color:#fff}
.dpad .u{grid-area:1/2;border-radius:9px 9px 0 0}.dpad .l{grid-area:2/1;border-radius:9px 0 0 9px}.dpad .r{grid-area:2/3;border-radius:0 9px 9px 0}.dpad .d{grid-area:3/2;border-radius:0 0 9px 9px}
.dpad .c{grid-area:2/2;background:var(--well)}
.mid{grid-area:menu;align-self:start;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;padding-top:4px}
.pill{font-family:var(--f-pixel);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--btn-green);border:0;border-radius:20px;padding:7px 14px;color:#fff}
.mid .keys{font-size:13px;color:#c4cae8;text-align:center;margin:0;line-height:1.3}
.ab{grid-area:ab;justify-self:end;align-self:end;display:flex;gap:10px;align-items:flex-start;padding-right:2px}
.ab button{width:58px;height:58px;border-radius:50%;border:0;font-family:var(--f-pixel);font-size:20px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.45);touch-action:none}
.ab button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.ab .a{background:var(--btn-green);color:#fff}
.ab .b{background:var(--btn-green-d);color:#fff;margin-top:26px}
body.compact #deck{min-height:130px;padding:8px 12px 12px}
body.compact .dpad{grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px)}
body.compact .ab button{width:46px;height:46px;font-size:17px}
body.compact .ab .b{margin-top:18px}
body.compact #dlg .txt{font-size:17px}

/* dialog */
#dlg{position:absolute;inset:0;background:var(--paper);color:var(--ink);border:4px solid var(--frame);border-radius:12px 12px 34px 34px;box-shadow:inset 0 0 0 3px var(--frame-in);padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;z-index:5;cursor:pointer}
#dlg .who{font-family:var(--f-pixel);font-weight:700;font-size:14px;color:var(--ink);align-self:flex-start;border-bottom:3px solid var(--accent);line-height:1.2}
#dlg .txt{font-family:var(--f-pixel);font-size:19px;line-height:1.4;flex:1;overflow:auto;margin:0;text-shadow:1px 1px 0 #d0d0c8}
#dlg .more{align-self:flex-end;font-family:var(--f-pixel);font-size:12px;color:var(--ink-2);animation:blink 1s steps(2) infinite}
#dlg .choices{display:flex;flex-wrap:wrap;gap:8px}
@keyframes blink{50%{opacity:0}}

/* overlays and panels */
.ov{position:absolute;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-block:12px 32px;display:flex;flex-direction:column;gap:12px}
.ov>*{flex-shrink:0;min-width:0}
.console{overflow-wrap:anywhere}
.ov.modal{background:rgba(9,14,19,.86);justify-content:flex-start;padding-top:18px}
.sheet{background:var(--paper);color:var(--ink);border-radius:12px;padding:18px;border:4px solid var(--frame);box-shadow:inset 0 0 0 3px var(--frame-in)}
.sheet h2,.ov h2{font-family:var(--f-pixel);font-size:22px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.sheet h3{font-family:var(--f-pixel);font-size:16px;margin:16px 0 6px}
.sheet p{margin:0 0 10px;max-width:65ch}
.sub{color:var(--ink-2);font-size:14px}
.eyebrow{font-family:var(--f-pixel);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 2px}
.btn{font-family:var(--f-pixel);font-size:15px;font-weight:600;padding:10px 14px;border-radius:10px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--ink);line-height:1.2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 3px 0 var(--ink)}
.btn.small{font-size:13px;padding:6px 10px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.list .btn{text-align:left;width:100%}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow strong{display:block;font-family:var(--f-pixel);font-size:15px}
.row .grow span{font-size:13px;color:var(--ink-2)}
.count{font-family:var(--f-pixel);font-variant-numeric:tabular-nums;min-width:2.5ch;text-align:right}
.terms{display:grid;grid-template-columns:1fr;gap:2px 0;margin:0}
.terms dt{font-weight:700;margin-top:8px}
.terms dd{margin:0;color:var(--ink-2)}
.mastery{display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle}
.mastery i{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.mastery i.on{background:var(--good)}
.deep{margin-top:12px;padding:12px 14px;background:var(--paper-2);border-radius:10px}
.deep:empty{display:none}
.deep p:last-child{margin-bottom:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.tab{font-family:var(--f-pixel);font-size:14px;padding:6px 12px;border-radius:20px;border:2px solid var(--ink);background:transparent;color:var(--ink)}
.tab.on{background:var(--ink);color:var(--paper)}
.muted{color:var(--ink-2)}
.err{color:var(--bad);font-weight:700}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-1px}
@keyframes rot{to{transform:rotate(360deg)}}

/* title */
.title .hero{padding:10px 2px 0}
.title .eyebrow{color:var(--muted)}
.logo{font-family:var(--f-pixel);font-weight:700;font-size:clamp(52px,17vw,84px);letter-spacing:.05em;line-height:1;margin:6px 0 8px;color:#f8f8f8;-webkit-text-stroke:2px #283078;text-shadow:4px 4px 0 var(--accent),8px 8px 0 #0b0e26}
.lede{font-size:16px;color:var(--paper-2);max-width:42ch;margin:0}
#titleScene{width:100%;height:auto;aspect-ratio:240/64;image-rendering:pixelated;border-radius:10px;display:block;border:4px solid var(--frame)}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{background:var(--paper);color:var(--ink);border:4px solid var(--frame);box-shadow:inset 0 0 0 3px var(--frame-in);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.slot .info{flex:1;min-width:180px}
.slot .info strong{display:block;font-family:var(--f-pixel);font-size:18px;line-height:1.2;word-break:break-word}
.slot .info span{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.slot.empty{background:transparent;color:var(--paper);border:2px dashed var(--shell-hi);box-shadow:none}
.slot.empty .info span{color:var(--muted)}
.fine{font-size:13px;color:#c4cae8;margin:0}
.sheet ol.steps{margin:0 0 10px;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.sheet a{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.sheet textarea{color:var(--ink);background:#fff;-webkit-user-select:text;user-select:text}

/* new game form */
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label,.field .lbl{font-family:var(--f-pixel);font-size:14px;font-weight:600}
.field input[type=text]{font:16px var(--f-body);padding:11px 12px;border-radius:10px;border:2px solid var(--ink);background:#fff;color:var(--ink);width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:5px 10px;border-radius:16px;border:1.5px solid var(--rule);background:var(--paper-2);color:var(--ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px var(--ink)}
.swatch[aria-pressed=true]{border-color:var(--paper);box-shadow:0 0 0 3px var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:9px 6px;border-radius:10px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--f-pixel);font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.seg small{display:block;font-family:var(--f-body);font-size:11px;opacity:.8}
.progress{height:12px;border-radius:6px;background:var(--paper-2);border:2px solid var(--ink);overflow:hidden;margin:14px 0 8px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}

/* battle */
.ov.fight{background:rgba(6,10,14,.42);backdrop-filter:blur(8px) saturate(1.15);-webkit-backdrop-filter:blur(8px) saturate(1.15);animation:fightIn .4s ease-out}
@keyframes fightIn{0%{background:rgba(255,255,255,.95)}100%{background:rgba(6,10,14,.42)}}
.arena{position:relative;width:100%;height:clamp(240px,46vh,440px);border-radius:6px;overflow:hidden;background:#000;flex:none;isolation:isolate}
@media (max-width:600px){.ov.fight{left:-16px;right:-16px;padding-inline:16px}.fight .arena{width:auto;margin-inline:-16px;border-radius:0}}
.arena .bgc{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.arena .pad{position:absolute;border-radius:50%;background:var(--ground-2);border:3px solid var(--ground-3);box-shadow:inset 0 6px 0 rgba(255,255,255,.25),0 4px 0 rgba(0,0,0,.18)}
.foe-pad{right:4%;top:46%;width:42%;height:11%}
.you-pad{left:-4%;bottom:2%;width:56%;height:14%}
.sprite{position:absolute;height:auto;aspect-ratio:2/3;image-rendering:pixelated;z-index:2;will-change:transform}
.foe-sp{right:16%;top:6%;bottom:48%;width:17%}
.you-sp{left:11%;bottom:-2%;width:23%}
.fx{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.fx>*{position:absolute;left:0;top:0}
.orb{width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle,#fff 0 30%,var(--accent) 31% 60%,transparent 62%);box-shadow:0 0 14px 4px var(--accent)}
.orb.foe{background:radial-gradient(circle,#fff 0 30%,#e04848 31% 60%,transparent 62%);box-shadow:0 0 14px 4px #e04848}
.spark{width:6px;height:6px;margin:-3px 0 0 -3px;background:#fff8c0;box-shadow:0 0 6px 2px var(--accent)}
.spark.foe{background:#ffd0d0;box-shadow:0 0 6px 2px #e04848}
.fx .flash{width:100%;height:100%;background:#fff;opacity:0}
.fx .flash.foe{background:radial-gradient(ellipse at center,transparent 35%,rgba(220,40,40,.85))}
.dmg{font-family:var(--f-pixel);font-weight:700;font-size:26px;color:#fff;-webkit-text-stroke:1.5px #283038;text-shadow:2px 2px 0 #283038;white-space:nowrap}
.dmg.foe{color:#ff8a7a}.dmg.big{font-size:32px;color:#ffe066}
.wipe{position:absolute;left:0;right:0;height:50%;background:#000;z-index:6}
.wipe.t{top:0}.wipe.b{bottom:0}
.card{position:absolute;z-index:4;background:#f8f8d8;color:var(--gba-out);border:3px solid var(--gba-out);border-radius:4px 14px 4px 14px;padding:5px 10px 6px;width:min(60%,230px);min-width:150px;font-family:var(--f-pixel);font-size:13px;box-shadow:3px 3px 0 rgba(48,64,72,.35)}
.card .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;font-weight:700;line-height:1.2}
.card .nm span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .nm span:last-child{flex:none;font-size:13px}
.card .ttl{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hprow{display:flex;align-items:center;gap:5px;margin-top:3px}
.hprow b{font-size:10px;line-height:1;background:#f0a030;color:#f8f8d8;padding:1px 3px;border-radius:3px}
.card .meter{width:100%;height:9px;margin:4px 0 0;background:#506070;border:2px solid var(--gba-out);border-radius:5px}
.hprow .meter{flex:1}
.card .meter>i{transition:width .8s cubic-bezier(.3,.8,.4,1),background-color .3s}
.card .meter.xp{height:4px;margin-top:3px;border-width:1px}.card .meter.xp>i{background:var(--xp)}
.card .num{display:block;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;margin-top:2px}
.foe-card{left:8px;top:10px}
.you-card{right:8px;bottom:10px;border-radius:14px 4px 14px 4px}
.console{background:var(--paper);color:var(--ink);border:4px solid var(--frame);box-shadow:inset 0 0 0 3px var(--frame-in);border-radius:12px;padding:16px;min-height:160px}
.log{font-family:var(--f-pixel);font-size:19px;margin:0;text-shadow:1px 1px 0 #d0d0c8}
.log.small{font-size:14px;color:var(--ink-2);margin-bottom:10px}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.move{text-align:left;padding:10px 12px;border-radius:10px;border:2px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);color:var(--ink)}
.move strong{display:block;font-family:var(--f-pixel);font-size:16px}
.move span{font-size:12px;color:var(--ink-2)}
.move:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.move:hover strong::after,.move:focus-visible strong::after{content:' ◀';font-size:12px}
.move.d1 strong::before,.move.d2 strong::before,.move.d3 strong::before{content:"";display:inline-block;width:9px;height:9px;margin-right:6px;transform:rotate(45deg);background:var(--accent);vertical-align:1px}
.move.d1 strong::before{opacity:.45}.move.d2 strong::before{opacity:.75}
.move.bag{background:var(--paper-2)}
.qmeta{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-pixel);font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.tagrev{background:var(--ink);color:var(--paper);padding:0 6px;border-radius:4px}
.qtext{font-size:17px;font-weight:700;margin:8px 0 12px;line-height:1.4}
.qarea{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:10px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:15px;line-height:1.35}
.opt .k{font-family:var(--f-pixel);font-weight:700;min-width:1.2em}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.sel{background:var(--ink);color:var(--paper)}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .opt{justify-content:center;font-family:var(--f-pixel);font-size:17px}
.shortrow{display:flex;gap:8px}
.shortrow input{flex:1;min-width:0;font:16px var(--f-body);padding:10px 12px;border-radius:10px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.matchgrid .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.matchgrid .opt{font-size:14px;word-break:break-word}
.opt .tag{font-family:var(--f-pixel);font-size:12px;background:var(--accent);color:var(--on-accent);border-radius:4px;padding:0 5px;margin-left:auto;align-self:center}
.seq{display:flex;flex-direction:column;gap:6px;min-height:20px;padding:8px;border:2px dashed var(--rule);border-radius:10px}
.seq:empty::before{content:"Tap the steps below in order";font-size:13px;color:var(--ink-2)}
.qtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qnote{font-size:14px;color:var(--ink-2);margin:8px 0 0}

.fb{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--skip-bg)}
.fb.ok{background:var(--good-bg)}.fb.no{background:var(--bad-bg)}
.fb strong{font-family:var(--f-pixel);font-size:17px}
.fb p{margin:6px 0 0}

.examhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.examhead .eyebrow{color:var(--muted)}
.examhead .score{font-family:var(--f-pixel);font-size:16px;color:var(--paper-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pips i{width:16px;height:8px;border-radius:2px;background:var(--shell-hi)}
.pips i.cur{background:var(--paper)}.pips i.ok{background:var(--hp)}.pips i.no{background:var(--hp-low)}.pips i.skip{background:var(--muted)}
.bigscore{font-family:var(--f-pixel);font-size:44px;line-height:1;margin:6px 0}
.miss{border-top:1px solid var(--rule);padding:10px 0}
.miss p{margin:2px 0}
.badgeart{width:84px;height:84px;margin:6px auto 12px;transform:rotate(45deg);background:var(--accent);border:4px solid var(--ink);box-shadow:inset 0 0 0 6px rgba(255,255,255,.35);border-radius:10px}
.center{text-align:center}
.center p{margin-inline:auto}
.cardgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.cardgrid div{text-align:center;font-size:11px;color:var(--ink-2);line-height:1.2}
.cardgrid b{display:block;width:26px;height:26px;margin:6px auto;transform:rotate(45deg);background:var(--rule);border-radius:4px}
.cardgrid b.on{background:var(--accent);border:2px solid var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;font-weight:700}
.chip-due{display:inline-block;margin-top:4px;font-family:var(--f-pixel);font-size:12px;padding:2px 8px;border-radius:10px;background:var(--accent);color:var(--on-accent)}
.slot .info span.chip-due{color:var(--on-accent)}
.dash{margin:8px 0 10px}

const GAPI='https://generativelanguage.googleapis.com/v1beta/';
function gErr(status,body){const m=String((body&&body.error&&body.error.message)||'');
  if(status===429)return{code:'rate_limited',message:m};
  if(status===400&&/api key/i.test(m))return{code:'bad_key',message:m};
  if(status===401||status===403)return{code:'bad_key',message:m};
  if(status===404)return{code:'no_model',message:m};
  if(status===400&&/location|region|not supported/i.test(m))return{code:'region',message:m};
  return{code:'upstream_error',message:m||('HTTP '+status)}}
function verNum(n){const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0}
async function listModels(key,force){
  if(!force){try{const c=JSON.parse(localStorage.getItem(GMODELS)||'null');if(c&&c.at>Date.now()-864e5&&c.key===key.slice(-6))return c}catch(e){}}
  let r;try{r=await fetch(GAPI+'models?pageSize=1000',{headers:{'x-goog-api-key':key}})}catch(e){throw{code:'offline'}}
  const body=await r.json().catch(()=>null);if(!r.ok)throw gErr(r.status,body);
  const all=((body&&body.models)||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>String(m.name).replace(/^models\//,''));
  const ok=n=>/^gemini-/.test(n)&&/flash/.test(n)&&!/(tts|live|image|audio|embed|transcribe|translate|thinking|exp)/.test(n);
  const stable=all.filter(n=>ok(n)&&!/preview/.test(n)),pool=stable.length?stable:all.filter(ok);
  const sort=a=>a.sort((x,y)=>verNum(y)-verNum(x)||(/latest/.test(x)?1:0)-(/latest/.test(y)?1:0));
  const lite=sort(pool.filter(n=>/lite/.test(n))),flash=sort(pool.filter(n=>!/lite/.test(n)));
  if(!lite.length)lite.push('gemini-flash-lite-latest');if(!flash.length)flash.push('gemini-flash-latest');
  const c={at:Date.now(),key:key.slice(-6),lite:lite.slice(0,3),flash:flash.slice(0,3)};

  const ta=h('textarea',{id:'restore',rows:'3',placeholder:'Paste a backup code here',style:'width:100%;font:14px var(--f-body);padding:8px;border-radius:10px;border:2px solid var(--ink)'});
  const slotSel=h('select',{id:'restoreSlot',style:'font:15px var(--f-body);padding:6px;border-radius:8px'},[0,1,2].map(i=>h('option',{value:String(i)},`into slot ${i+1}`)));
  const file=h('input',{type:'file',accept:'.json,application/json,text/plain',style:'max-width:100%'});
  const restore=async(text)=>{try{let t=text.trim();if(t.startsWith('LEARNY1:'))t=b64d(t.slice(8));const o=JSON.parse(t);const st=o&&o.state;if(!st||!st.bp||!st.player)throw 0;
      await Store.save(+slotSel.value,st);msg.textContent=`Restored "${st.topic}" into slot ${+slotSel.value+1}.`}catch(e){msg.textContent='That does not look like a Learny backup.'}};
  file.onchange=async()=>{const f=file.files&&file.files[0];if(f)restore(await f.text())};
  body.append(...rows,h('h3',{},'Restore'),ta,h('div',{class:'actions'},slotSel,h('button',{class:'btn',onclick:()=>restore(ta.value)},'Restore code')),h('p',{class:'fine',style:'color:var(--ink-2)'},'Or pick a backup file:'),file);
})}
async function startGame(st,slot,isNew){
  S=fixState(st);curSlot=slot;MAPS={};pools={};busy=0;held.length=0;
  S.league=S.league||[false,false,false,false,false];
  PAL=makePal(S.bp);TC={};SC={};applyTheme();
  if(titleOv){titleOv.remove();titleOv=null}titleCv=null;
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  changeArea(S.area,S.x,S.y,S.dir||'down');
  if(S.hp<=0)S.hp=maxHP();hud();
  if(isNew||!S.introDone){await intro()}
  else await say([`Welcome back, ${S.player.name}. You're in ${areaName(S.area)}.`]);
}

/* ================= boot ================= */
window.addEventListener('beforeunload',()=>{if(S&&curSlot!=null)localSet(curSlot,S)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
function boot(data){
  requestAnimationFrame(loop);
  if(data&&data.S&&data.slot!=null){Store.ready.then(()=>startGame(data.S,data.slot,false))}else titleScreen();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S:S?JSON.parse(JSON.stringify(S)):null,slot:curSlot}))}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>


<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
